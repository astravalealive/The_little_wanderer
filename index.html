<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The Little Wanderer</title><style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,sans-serif;background:#10151b;color:#e9e6dc}*{box-sizing:border-box}body{margin:0;padding:18px;max-width:1000px;margin:auto}h1{margin:0;font-size:clamp(25px,5vw,38px)}p{color:#b9c5c2}.layout{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(240px,1fr);gap:15px;margin-top:16px}.panel{background:#1b252a;border:1px solid #354640;border-radius:17px;padding:14px}canvas{width:100%;border-radius:12px;display:block;background:#20382f;touch-action:manipulation}button,input{font:inherit;border-radius:10px;padding:11px;border:1px solid #53675d;background:#304c40;color:#fff}button{cursor:pointer}button:hover{background:#42634f}.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}button:focus-visible,input:focus-visible{outline:3px solid #c2e9b2}#log{height:245px;overflow:auto;font-size:13px;line-height:1.5}#log div{padding:6px 0;border-bottom:1px solid #34423c}#reply{min-height:45px;color:#d6e9bf}.stat{display:flex;align-items:center;gap:8px;margin:8px 0}.stat label{width:75px;font-size:13px}.bar{flex:1;background:#34423f;border-radius:9px;height:10px;overflow:hidden}.bar span{display:block;height:100%;background:#a4c8a0}.chat{display:flex;gap:7px}.chat input{width:100%;min-width:0;background:#101b1b}.small{font-size:12px;color:#a5b5b0}@media(max-width:720px){.layout{grid-template-columns:1fr}}
</style></head><body><h1>🐦‍⬛ The Little Wanderer</h1><p>A tiny life with its own rhythms. Meet <strong>Ember</strong>, a curious young raven. Tap the landscape to invite Ember over.</p><div class="layout"><section class="panel"><canvas id="world" width="640" height="440" aria-label="Ember's illustrated forest home"></canvas><div class="actions"><button id="feed">🍓 Offer berries</button><button id="play">✨ Play</button><button id="rest">🌙 Encourage rest</button><button id="paint">🎨 Paint together</button></div><p id="reply" role="status"></p></section><aside><section class="panel"><h2>Ember's day</h2><div id="stats"></div><p id="mood"></p><p class="small" id="clock"></p></section><section class="panel" style="margin-top:12px"><h2>Talk to Ember</h2><form id="chat" class="chat"><input id="message" maxlength="200" placeholder="Say something..." aria-label="Message to Ember"><button>Send</button></form><p class="small">Prototype conversation uses simple rules, not a language model.</p></section><section class="panel" style="margin-top:12px"><h2>Memory journal</h2><div id="log" aria-live="polite"></div><button id="export" style="margin-top:10px">Export memories</button></section></aside></div><script>
(()=>{'use strict';const KEY='little-wanderer-v1';const canvas=document.getElementById('world'),ctx=canvas.getContext('2d');const clamp=n=>Math.max(0,Math.min(100,n));const initial=()=>({x:320,y:230,targetX:320,targetY:230,energy:76,hunger:30,curiosity:70,bond:12,paintings:0,steps:0,memories:[],lastSaved:Date.now(),nextAction:0,activity:'exploring'});let state;try{state={...initial(),...JSON.parse(localStorage.getItem(KEY)||'{}')}}catch{state=initial()}const elapsed=Math.min(8*3600,Math.max(0,(Date.now()-state.lastSaved)/1000));state.hunger=clamp(state.hunger+elapsed/160);state.energy=clamp(state.energy-elapsed/240);state.curiosity=clamp(state.curiosity+elapsed/360);state.x=Math.max(30,Math.min(610,state.x));state.y=Math.max(110,Math.min(390,state.y));let last=performance.now();const rand=(a,b)=>a+Math.random()*(b-a);const say=t=>{document.getElementById('reply').textContent=t};function remember(t){state.memories.unshift({at:new Date().toISOString(),text:t});state.memories=state.memories.slice(0,80);renderLog()}function renderLog(){document.getElementById('log').innerHTML='';for(const m of state.memories){const d=document.createElement('div');d.textContent=new Date(m.at).toLocaleString()+' · '+m.text;document.getElementById('log').append(d)}}function save(){state.lastSaved=Date.now();try{localStorage.setItem(KEY,JSON.stringify(state))}catch{say('Storage unavailable: this visit may not persist.')}}function moveTo(x,y){state.targetX=Math.max(28,Math.min(610,x));state.targetY=Math.max(112,Math.min(392,y))}function choose(){if(state.energy<24){state.activity='resting';moveTo(475,265);state.energy=clamp(state.energy+7);return}if(state.hunger>67){state.activity='foraging';moveTo(150,300);state.hunger=clamp(state.hunger-14);remember('Ember found something to eat in the berry patch.');return}const r=Math.random();if(r<.22){state.activity='painting';moveTo(510,190);state.paintings++;state.curiosity=clamp(state.curiosity+5);remember('Ember painted picture #'+state.paintings+'.')}else if(r<.42){state.activity='resting';moveTo(475,265);state.energy=clamp(state.energy+12)}else if(r<.65){state.activity='foraging';moveTo(150,300);state.hunger=clamp(state.hunger-8)}else{state.activity='exploring';moveTo(rand(65,575),rand(145,380));state.curiosity=clamp(state.curiosity+3)}}function interact(type){if(type==='feed'){state.hunger=clamp(state.hunger-30);state.bond=clamp(state.bond+4);remember('You shared berries with Ember.');say('Ember chirps appreciatively and pockets a berry.')}if(type==='play'){state.energy=clamp(state.energy-8);state.curiosity=clamp(state.curiosity+16);state.bond=clamp(state.bond+7);remember('You played with Ember.');say('Ember hops in a delighted little circle.')}if(type==='rest'){state.energy=clamp(state.energy+20);state.bond=clamp(state.bond+2);moveTo(475,265);remember('You helped Ember settle down for a rest.');say('Ember tucks its head beneath a wing.')}if(type==='paint'){state.paintings++;state.curiosity=clamp(state.curiosity+10);state.bond=clamp(state.bond+5);moveTo(510,190);remember('You and Ember made painting #'+state.paintings+'.');say('Ember leaves three enthusiastic brush marks. A masterpiece, probably.')}render();save()}for(const type of ['feed','play','rest','paint'])document.getElementById(type).onclick=()=>interact(type);canvas.addEventListener('pointerdown',e=>{const r=canvas.getBoundingClientRect();moveTo((e.clientX-r.left)*640/r.width,(e.clientY-r.top)*440/r.height);state.bond=clamp(state.bond+.3);say('Ember tilts its head and comes to investigate.');save()});document.getElementById('chat').onsubmit=e=>{e.preventDefault();const input=document.getElementById('message');const msg=input.value.trim();if(!msg)return;input.value='';remember('You said: '+msg);const lower=msg.toLowerCase();let answer;if(/hello|hi|hey/.test(lower))answer='Chirp! Ember recognises your voice.';else if(/paint|draw|art/.test(lower))answer='Ember glances towards the easel, clearly tempted.';else if(/name|who are you/.test(lower))answer='Ember! That is my name. I think it suits me.';else if(/how are you|feel/.test(lower))answer=state.energy<30?'Sleepy. The nest looks lovely right now.':'Curious! There are still corners of this island I have not checked.';else answer='Ember listens carefully, then makes a thoughtful little chirp.';remember('Ember replied: '+answer);state.bond=clamp(state.bond+2);say(answer);render();save()};document.getElementById('export').onclick=()=>{const blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='ember-memories.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};function render(){const stats=[['Energy',state.energy],['Hunger',100-state.hunger],['Curiosity',state.curiosity],['Friendship',state.bond]];document.getElementById('stats').innerHTML=stats.map(([k,v])=>`<div class="stat"><label>${k}</label><div class="bar"><span style="width:${clamp(v)}%"></span></div><small>${Math.round(v)}</small></div>`).join('');document.getElementById('mood').textContent='Currently: '+state.activity+' · Paintings: '+state.paintings;document.getElementById('clock').textContent='World saved locally · '+new Date().toLocaleTimeString()}
function draw(t){const w=640,h=440;ctx.clearRect(0,0,w,h);ctx.fillStyle='#9cc6b2';ctx.fillRect(0,0,w,h);ctx.fillStyle='#638f73';ctx.beginPath();ctx.ellipse(320,275,305,155,0,0,7);ctx.fill();ctx.fillStyle='#48765d';ctx.beginPath();ctx.ellipse(320,310,270,110,0,0,7);ctx.fill();ctx.fillStyle='#4a8c9c';ctx.beginPath();ctx.ellipse(330,352,80,28,0,0,7);ctx.fill();for(let i=0;i<11;i++){const x=35+i*57,y=135+(i%3)*30;ctx.fillStyle='#4c7053';ctx.fillRect(x-5,y,10,45);ctx.fillStyle=i%2?'#2c6349':'#315a48';ctx.beginPath();ctx.arc(x,y,25,0,7);ctx.fill()}ctx.fillStyle='#aa7759';ctx.fillRect(415,217,112,72);ctx.fillStyle='#5e4a4e';ctx.beginPath();ctx.moveTo(399,219);ctx.lineTo(471,166);ctx.lineTo(541,219);ctx.fill();ctx.fillStyle='#e6c88c';ctx.fillRect(458,248,28,41);ctx.fillStyle='#b5a085';ctx.fillRect(501,154,8,58);ctx.fillStyle='#eee0b5';ctx.fillRect(481,158,46,33);ctx.fillStyle='#9d6d8b';ctx.beginPath();ctx.arc(493,171,7,0,7);ctx.arc(514,180,7,0,7);ctx.fill();for(let i=0;i<9;i++){const x=90+(i%3)*28,y=294+Math.floor(i/3)*18;ctx.fillStyle='#8d4e66';ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill()}ctx.fillStyle='#25333c';ctx.beginPath();ctx.ellipse(state.x,state.y+20,21,8,0,0,7);ctx.fill();const bob=Math.sin(t/240)*2;ctx.fillStyle='#202631';ctx.beginPath();ctx.ellipse(state.x,state.y+bob,21,26,0,0,7);ctx.fill();ctx.beginPath();ctx.arc(state.x,state.y-20+bob,20,0,7);ctx.fill();ctx.fillStyle='#d99a5c';ctx.beginPath();ctx.moveTo(state.x+15,state.y-17+bob);ctx.lineTo(state.x+36,state.y-12+bob);ctx.lineTo(state.x+16,state.y-7+bob);ctx.fill();ctx.fillStyle='#f2c880';ctx.beginPath();ctx.arc(state.x+8,state.y-24+bob,4,0,7);ctx.fill();ctx.fillStyle='#1a1d22';ctx.beginPath();ctx.arc(state.x+9,state.y-24+bob,1.5,0,7);ctx.fill();ctx.fillStyle='#2d3741';ctx.beginPath();ctx.ellipse(state.x-13,state.y+4+bob,10,17,-.3,0,7);ctx.fill();ctx.fillStyle='#e7d8b3';ctx.font='bold 17px system-ui';ctx.fillText('Ember’s Island',18,32)}function loop(now){const dt=Math.min((now-last)/1000,.2);last=now;state.hunger=clamp(state.hunger+dt*.065);state.energy=clamp(state.energy-dt*.045);state.curiosity=clamp(state.curiosity-dt*.025);if(now>state.nextAction){choose();state.nextAction=now+rand(5500,11000);render()}const dx=state.targetX-state.x,dy=state.targetY-state.y,d=Math.hypot(dx,dy);if(d>2){const s=Math.min(d,dt*57);state.x+=dx/d*s;state.y+=dy/d*s}draw(now);requestAnimationFrame(loop)}if(!state.memories.length)remember('Ember woke up on the island for the first time.');renderLog();render();say('Ember is exploring. Try offering berries or saying hello.');setInterval(save,5000);document.addEventListener('visibilitychange',()=>{if(document.hidden)save()});window.addEventListener('pagehide',save);requestAnimationFrame(loop)})();
</script></body></html>
