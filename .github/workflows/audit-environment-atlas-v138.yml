name: Audit all environment sprite atlases V138
on:
  push:
    paths:
      - .github/scripts/audit_environment_atlas_v138.py
      - .github/workflows/audit-environment-atlas-v138.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect-atlases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install deterministic image inspection tools
        run: python -m pip install --disable-pip-version-check Pillow numpy
      - name: Inspect source atlas and all image assets
        run: python .github/scripts/audit_environment_atlas_v138.py
      - name: Commit diagnostic report, no changes to images
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/environment-atlas-audit-v138.json
          if git diff --cached --quiet; then
            echo 'No report changes'
          else
            git commit -m 'Report environment atlas bleed diagnostics V138'
            git push origin HEAD:main
          fi
