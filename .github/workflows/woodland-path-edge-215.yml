name: Woodland path cohesion 215
on:
  pull_request:
    paths:
      - haigen.html
      - tests/live/woodland-path-edge-215.cjs
      - .github/workflows/woodland-path-edge-215.yml
  workflow_dispatch:
jobs:
  woodland-path:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/live/woodland-path-edge-215.cjs
