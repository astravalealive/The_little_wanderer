name: Build Skolli fox v126 art
on:
  push:
    paths:
      - .github/scripts/build_skolli_v126.py
      - .github/workflows/skolli-v126-asset.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  make-sprite:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check pillow
      - run: python .github/scripts/build_skolli_v126.py
      - name: Commit 20-pose fox atlas without touching approved Dylan
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/skolli-fox-v126.png
          if git diff --cached --quiet; then
            echo 'Skölli atlas already installed'
          else
            git commit -m 'Install Skölli 20-pose fox atlas V126'
            git push origin HEAD:main
          fi
