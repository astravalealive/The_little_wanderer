name: Skiff boarding guidance 211
on:
  pull_request:
    paths:
      - 'haigen.html'
      - 'tests/live/skiff-boarding-guidance-211.cjs'
      - '.github/workflows/skiff-boarding-guidance-211.yml'
  workflow_dispatch:
jobs:
  skiff-boarding-guidance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/live/skiff-boarding-guidance-211.cjs
