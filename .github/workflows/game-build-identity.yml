name: Game build identity
on:
  pull_request:
    paths:
      - 'haigen.html'
      - 'haigen-version.json'
      - 'tests/live/game-build-identity.cjs'
      - '.github/workflows/game-build-identity.yml'
  workflow_dispatch:
jobs:
  game-build-identity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/live/game-build-identity.cjs
