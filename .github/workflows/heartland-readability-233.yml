name: Heartland readability 233
on:
  push:
    paths:
      - haigen.html
      - haigen-version.json
      - tests/live/heartland-readability-233.cjs
      - .github/workflows/heartland-readability-233.yml
  pull_request:
    paths:
      - haigen.html
      - haigen-version.json
      - tests/live/heartland-readability-233.cjs
      - .github/workflows/heartland-readability-233.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  heartland-readability:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.56.1
      - run: node tests/live/heartland-readability-233.cjs
