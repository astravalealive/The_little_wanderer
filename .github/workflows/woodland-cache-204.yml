name: Woodland cache prototype evidence
on:
  pull_request:
    paths:
      - 'haigen.html'
      - 'tests/live/woodland-cache-204.cjs'
      - '.github/workflows/woodland-cache-204.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cache-evidence:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser dependency
        run: npm install --no-save playwright-core@1.56.1
      - name: Compare cached versus original woodland pixels and memory
        run: node tests/live/woodland-cache-204.cjs
      - name: Upload cache evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: woodland-cache-204-evidence
          path: woodland-cache-204-evidence/
          if-no-files-found: warn
