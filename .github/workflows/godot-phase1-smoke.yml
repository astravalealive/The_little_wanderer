name: Godot Phase 1 smoke
on:
  pull_request:
    paths:
      - "godot-haigen/**"
      - "docs/godot-migration/**"
      - ".github/workflows/godot-phase1-smoke.yml"
  push:
    paths:
      - "godot-haigen/**"
      - "docs/godot-migration/**"
      - ".github/workflows/godot-phase1-smoke.yml"
jobs:
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Phase 1 asset and scene check
        run: python3 godot-haigen/tests/test_phase1_assets.py
  boot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1
        run: |
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
      - name: Import and headless boot
        run: |
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --import --path godot-haigen
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --path godot-haigen --quit-after 3
