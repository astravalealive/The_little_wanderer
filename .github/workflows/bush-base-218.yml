name: Woodland bush base 218
on:
  pull_request:
    paths:
      - haigen.html
      - tests/live/bush-base-218.cjs
      - .github/workflows/bush-base-218.yml
  workflow_dispatch:
jobs:
  bush-base:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/live/bush-base-218.cjs
