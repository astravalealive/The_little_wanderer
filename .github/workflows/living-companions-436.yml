name: Living companions 436
on:
  push:
    paths:
      - haigen.html
      - haigen-version.json
      - tests/live/living-companions-436.cjs
      - .github/workflows/living-companions-436.yml
  pull_request:
    paths:
      - haigen.html
      - haigen-version.json
      - tests/live/living-companions-436.cjs
      - .github/workflows/living-companions-436.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  living-companions:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.56.1
      - run: node tests/live/game-build-identity.cjs
      - run: node tests/live/living-companions-436.cjs
