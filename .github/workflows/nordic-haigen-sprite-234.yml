name: Nordic Haigen sprite 234
on:
  push:
    paths:
      - haigen.html
      - haigen-version.json
      - assets/haigen-nordic-walk-atlas-v433.webp
      - tests/live/nordic-haigen-sprite-234.cjs
      - .github/workflows/nordic-haigen-sprite-234.yml
  pull_request:
    paths:
      - haigen.html
      - haigen-version.json
      - assets/haigen-nordic-walk-atlas-v433.webp
      - tests/live/nordic-haigen-sprite-234.cjs
      - .github/workflows/nordic-haigen-sprite-234.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  nordic-haigen-sprite:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.56.1
      - run: node tests/live/nordic-haigen-sprite-234.cjs
