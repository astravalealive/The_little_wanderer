name: Quiet Nordic HUD 232
on:
  pull_request:
    paths:
      - 'haigen.html'
      - 'haigen-version.json'
      - 'v127-ornate-ui.css'
      - 'tests/live/quiet-nordic-hud-232.cjs'
      - '.github/workflows/quiet-nordic-hud-232.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  quiet-hud:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save playwright-core@1.56.1
      - name: Run quiet HUD overlap checks
        run: node tests/live/quiet-nordic-hud-232.cjs
