name: Haigen live regression
on:
  pull_request:
    paths:
      - 'haigen.html'
      - 'assets/**'
      - 'tests/live/**'
      - '.github/workflows/haigen-live-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  live-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install browser test dependency
        run: npm install --no-save playwright-core@1.56.1
      - name: Run live-game regression checks
        run: node tests/live/run.cjs
      - name: Upload diagnostic screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: haigen-live-regression-failures
          path: /tmp/haigen-live-*.png
          if-no-files-found: ignore
