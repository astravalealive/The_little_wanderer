name: Skiff wood guidance 209
on:
  pull_request:
    paths:
      - 'haigen.html'
      - 'tests/live/skiff-wood-guidance-209.cjs'
      - '.github/workflows/skiff-wood-guidance-209.yml'
  workflow_dispatch:
jobs:
  skiff-wood-guidance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/live/skiff-wood-guidance-209.cjs
