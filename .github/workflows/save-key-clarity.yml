name: Save key clarity
on:
  pull_request:
    paths:
      - 'haigen.html'
      - 'docs/haigen-save-keys.md'
      - 'tests/live/save-key-clarity.cjs'
      - '.github/workflows/save-key-clarity.yml'
  workflow_dispatch:
jobs:
  save-key-clarity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/live/save-key-clarity.cjs
