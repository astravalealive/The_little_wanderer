name: Godot homestead smoke
on:
  pull_request:
    paths:
      - "godot-haigen/**"
      - ".github/workflows/godot-homestead-smoke.yml"
  push:
    paths:
      - "godot-haigen/**"
      - ".github/workflows/godot-homestead-smoke.yml"
jobs:
  map-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate homestead map
        run: python3 godot-haigen/tests/test_map_integrity.py
