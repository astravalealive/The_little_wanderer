name: Godot homestead smoke
on:
  pull_request:
    paths:
      - "godot-haigen/**"
      - ".github/workflows/godot-homestead-smoke.yml"
  push:
    paths:
      - "godot-haigen/**"
      - ".github/workflows/godot-homestead-smoke.yml"
jobs:
  map-integrity:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate homestead map
        run: python3 godot-haigen/tests/test_map_integrity.py
  ipad-landscape-viewport:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot 4.4.1 and Xvfb
        run: |
          curl -fsSL -o /tmp/godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.4.1-stable_linux.x86_64
          sudo apt-get update
          sudo apt-get install -y xvfb
      - name: Import textures
        run: |
          # .godot/imported is not committed. Import before the playable check.
          /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 --headless --import --path godot-haigen
      - name: Run 1024x768 touch, camera, collision and render checks
        run: |
          xvfb-run -a -s '-screen 0 1024x768x24' \
            /tmp/godot/Godot_v4.4.1-stable_linux.x86_64 \
            --path godot-haigen --resolution 1024x768 --audio-driver Dummy \
            res://tools/ipad_landscape_validate.tscn
