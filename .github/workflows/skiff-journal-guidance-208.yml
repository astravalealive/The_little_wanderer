name: Skiff journal guidance 208
on:
  pull_request:
    paths:
      - 'haigen.html'
      - 'tests/live/skiff-journal-guidance-208.cjs'
      - '.github/workflows/skiff-journal-guidance-208.yml'
  workflow_dispatch:
jobs:
  skiff-journal:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/live/skiff-journal-guidance-208.cjs
