name: Controlled Y-sort visual evidence 269
on:
  pull_request:
    paths:
      - 'haigen.html'
      - 'tests/live/depth-visual-evidence-269.cjs'
      - '.github/workflows/depth-visual-evidence-269.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  controlled-depth:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Playwright
        run: npm install --no-save playwright-core@1.56.1
      - name: Capture paired front and behind screenshots
        run: node tests/live/depth-visual-evidence-269.cjs
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: controlled-depth-269
          path: depth-visual-evidence/*.png
          if-no-files-found: warn
