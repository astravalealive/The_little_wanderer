name: Navigation experiment checks
on:
  pull_request:
    paths:
      - 'haigen.html'
      - 'experiments/engine-foundations/**'
      - '.github/workflows/navigation-experiment.yml'
  workflow_dispatch:
jobs:
  navigation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check navigation module and regression tests
        run: |
          node --check experiments/engine-foundations/navigation-watchdog.js
          node experiments/engine-foundations/navigation-watchdog.test.cjs
      - name: Check game inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs=require('node:fs');
          const html=fs.readFileSync('haigen.html','utf8');
          const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/g)].map(x=>x[1]).filter(Boolean);
          if(!scripts.length)throw new Error('No inline scripts found');
          const vm=require('node:vm');
          scripts.forEach((script,i)=>new vm.Script(script,{filename:'haigen-inline-'+i+'.js'}));
          if(!html.includes('src="experiments/engine-foundations/navigation-watchdog.js"'))throw new Error('Navigation module missing');
          console.log('Checked',scripts.length,'inline scripts');
          NODE
