name: Lake fish Nordic sprites 228
on:
  push:
    paths:
      - haigen.html
      - haigen-version.json
      - tests/live/lake-fish-228.cjs
      - .github/workflows/lake-fish-228.yml
  pull_request:
    paths:
      - haigen.html
      - haigen-version.json
      - tests/live/lake-fish-228.cjs
      - .github/workflows/lake-fish-228.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lake-fish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-save playwright-core@1.56.1
      - run: node tests/live/lake-fish-228.cjs
