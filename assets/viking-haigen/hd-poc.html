<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<title>Viking Haigen HD walk PoC · issue #292</title>
<style>
  :root{--bg:#121916;--ink:#f3ead2;--muted:#9bb09a;--accent:#c9a227;--ok:#6f925c;--bad:#b85c4a}
  *{box-sizing:border-box}
  body{margin:0;background:radial-gradient(1200px 600px at 50% 0%,#243028,#121916);color:var(--ink);font:15px/1.4 Georgia,serif;min-height:100vh}
  header{padding:16px 20px 8px;max-width:980px;margin:0 auto}
  h1{margin:0 0 4px;font-size:1.35rem;letter-spacing:.02em}
  p{margin:.35rem 0;color:var(--muted)}
  .ok{color:var(--ok)} .bad{color:var(--bad)}
  #stageWrap{max-width:980px;margin:0 auto;padding:8px 20px 24px}
  canvas{width:100%;max-width:720px;height:auto;background:#1a221c;border:1px solid #3a4a40;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none;display:block}
  .row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
  button{background:#3f5a45;color:var(--ink);border:1px solid #6f925c;padding:.55rem .85rem;font:inherit;cursor:pointer}
  button.active{background:#c9a227;color:#1a221c;border-color:#e6d08a}
  .meta{font-size:.85rem;color:var(--muted);margin-top:10px}
  .previews{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .previews figure{margin:0;background:#1a221c;padding:8px;border:1px solid #3a4a40}
  .previews img{display:block;height:160px;width:auto;image-rendering:pixelated}
  .previews figcaption{font-size:.75rem;color:var(--muted);margin-top:4px}
</style>
</head>
<body>
<header>
  <h1>Viking Haigen · HD walk proof of concept</h1>
  <p>Issue #292 · production cells <strong>384×720</strong> · 6-frame loops · Captain lock preserved on front.</p>
  <p id="status">Loading atlas…</p>
</header>
<div id="stageWrap">
  <canvas id="c" width="720" height="480" aria-label="Haigen walk stage"></canvas>
  <div class="row" id="dirs">
    <button data-dir="front" class="active">Front</button>
    <button data-dir="right">Right</button>
    <button data-dir="back">Back</button>
    <button data-dir="left">Left</button>
    <button id="togglePlay">Pause</button>
  </div>
  <p class="meta">Arrow keys / WASD also change facing. Touch the canvas and drag. This page does <em>not</em> replace live <code>haigen.html</code>.</p>
  <div class="previews" id="previews"></div>
</div>
<script>
const dirs=['front','right','back','left'];
const frames={};
let atlas=null, dir='front', frame=0, playing=true, last=0;
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
ctx.imageSmoothingEnabled=false;
const status=document.getElementById('status');

async function load(){
  atlas=await (await fetch('./production/atlas-hd.json')).json();
  await Promise.all(dirs.map(async d=>{
    const imgs=[];
    for(let i=0;i<6;i++){
      const im=new Image();
      im.decoding='async';
      im.src=`./production/walk/${d}/frame_${String(i).padStart(2,'0')}.png`;
      await im.decode();
      imgs.push(im);
    }
    frames[d]=imgs;
  }));
  const qa=atlas.qa||{};
  const parts=dirs.map(d=>{
    const ok=qa[d]?.ok;
    return `<span class="${ok?'ok':'bad'}">${d}:${ok?'PASS':'FAIL'}</span>`;
  });
  status.innerHTML=`Loaded ${atlas.cell.w}×${atlas.cell.h} · ${parts.join(' · ')} · ${atlas.frame_ms}ms/frame`;
  const previews=document.getElementById('previews');
  dirs.forEach(d=>{
    const fig=document.createElement('figure');
    fig.innerHTML=`<img src="./production/walk/${d}/loop.gif" alt="${d} loop"/><figcaption>${d} verified loop</figcaption>`;
    previews.appendChild(fig);
  });
  requestAnimationFrame(tick);
}

function draw(){
  ctx.fillStyle='#1a221c';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  // soft ground
  ctx.fillStyle='#173d3466';
  ctx.beginPath();ctx.ellipse(360,400,90,18,0,0,Math.PI*2);ctx.fill();
  const im=frames[dir]?.[frame];
  if(!im)return;
  const scale=0.45; // fit stage while keeping nearest-neighbour
  const w=im.naturalWidth*scale, h=im.naturalHeight*scale;
  const x=360-w/2, y=408-h;
  ctx.imageSmoothingEnabled=false;
  ctx.drawImage(im,x,y,w,h);
  ctx.fillStyle='#9bb09a';
  ctx.font='14px Georgia';
  ctx.fillText(`${dir} · frame ${frame}`,16,24);
}

function tick(t){
  if(playing && t-last>=(atlas?.frame_ms||150)){
    frame=(frame+1)%6; last=t;
  }
  draw();
  requestAnimationFrame(tick);
}

document.getElementById('dirs').addEventListener('click',e=>{
  const b=e.target.closest('button[data-dir]');
  if(!b)return;
  dir=b.dataset.dir; frame=0;
  document.querySelectorAll('button[data-dir]').forEach(x=>x.classList.toggle('active',x===b));
});
document.getElementById('togglePlay').addEventListener('click',e=>{
  playing=!playing; e.target.textContent=playing?'Pause':'Play';
});
addEventListener('keydown',e=>{
  const map={ArrowDown:'front',s:'front',ArrowRight:'right',d:'right',ArrowUp:'back',w:'back',ArrowLeft:'left',a:'left'};
  if(map[e.key]){dir=map[e.key];frame=0;
    document.querySelectorAll('button[data-dir]').forEach(x=>x.classList.toggle('active',x.dataset.dir===dir));
  }
});
let drag=null;
canvas.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});
canvas.addEventListener('pointerup',e=>{
  if(!drag)return;
  const dx=e.clientX-drag.x, dy=e.clientY-drag.y;
  if(Math.hypot(dx,dy)<12)return;
  dir=Math.abs(dx)>Math.abs(dy)?(dx>0?'right':'left'):(dy>0?'front':'back');
  frame=0;
  document.querySelectorAll('button[data-dir]').forEach(x=>x.classList.toggle('active',x.dataset.dir===dir));
  drag=null;
});
load().catch(err=>{status.innerHTML=`<span class="bad">Load failed: ${err}</span>`});
</script>
</body>
</html>
