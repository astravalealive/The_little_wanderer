,2,'#302b29');ellipse(29,-4,20,11,'#d97635');ellipse(44,-3,9,8,'#f5e5c8')}ctx.restore()}function draw(){ctx.clearRect(0,0,W,H);const zoom=clamp(Math.min(W/800,H/580),.62,1.25);ctx.save();ctx.translate(W/2,H/2);ctx.scale(zoom,zoom);ctx.translate(-cam.x,-cam.y);for(let yy=0;yy<WORLD;yy+=260)for(let xx=0;xx<WORLD;xx+=260){ctx.fillStyle=biomeColors[biomeAt(xx+130,yy+130)];ctx.fillRect(xx,yy,261,261)}for(let i=0;i<850;i++){let x=seeded(i+950)*WORLD,y=seeded(i+1200)*WORLD;ellipse(x,y,18+seeded(i+800)*55,8+seeded(i+700)*25,i%2?'#9fc47a55':'#72a96044')}path();ellipse(pond.x,pond.y,pond.rx+16,pond.ry+13,'#e3d5a4');ellipse(pond.x,pond.y,pond.rx,pond.ry,'#63b8bd');ellipse(pond.x-45,pond.y-20,105,28,'#8bd5d1');ellipse(pond.x+55,pond.y+31,63,14,'#79c8c5');for(let i=0;i<5;i++)ellipse(pond.x-90+i*40,pond.y+65+(i%2)*11,13,6,'#5c9d5b');const visible=objects.filter(o=>!state.removed.includes(o.id)&&Math.abs(o.x-cam.x)<W/zoom/2+150&&Math.abs(o.y-cam.y)<H/zoom/2+150);const drawables=[...wildlife.filter(a=>Math.abs(a.x-cam.x)<W/zoom/2+80&&Math.abs(a.y-cam.y)<H/zoom/2+80).map(a=>({y:a.y,draw:()=>{ctx.font='29px system-ui';ctx.fillText(a.symbol,a.x,a.y)}})),...visible.map(o=>({y:o.y,draw:()=>({tree,rock,bush,flower}[o.type]||specialPlant)(o)})),{y:cottage.y,draw:()=>house(cottage.x,cottage.y)},{y:ruins.y,draw:()=>ruin(ruins.x,ruins.y)},...state.structures.map(s=>({y:s.y,draw:()=>structure(s)})),{y:state.y,draw:()=>character(state.x,state.y,'boy')},...companions.map(c=>({y:c.y,draw:()=>character(c.x,c.y,c.kind)}))];drawables.sort((a,b)=>a.y-b.y).forEach(o=>o.draw());for(let c of companions){ctx.font='bold 16px system-ui';ctx.textAlign='center';ctx.fillStyle='#183d32';ctx.fillText(c.name,c.x,c.y-65)}ctx.restore();const day=1+Math.floor(state.daytime/180),phase=['Morning','Afternoon','Evening','Night'][Math.floor(state.daytime%180/45)];$('day').textContent=`Day ${day} • ${phase}`;$('resources').textContent=`🪵 ${state.wood}   🪨 ${state.stone}   🍓 ${state.berries}`;}function controllerMove(){if(!navigator.getGamepads)return {x:0,y:0};const pad=Array.from(navigator.getGamepads()||[]).find(p=>p&&p.connected);if(!pad)return {x:0,y:0};const axis=i=>Math.abs(pad.axes[i]||0)>.18?pad.axes[i]:0;const down=i=>pad.buttons[i]&&pad.buttons[i].pressed?1:0;let x=axis(0),y=axis(1);if(pad.mapping==='standard'){x+=down(15)-down(14);y+=down(13)-down(12)}return {x,y}}function update(dt){time+=dt;state.daytime+=dt*.018;const currentBiome=biomeAt(state.x,state.y);if(currentBiome!==lastBiome){lastBiome=currentBiome;if(state.steps>20)memory('Haigen entered the '+currentBiome+' region. His travelling clothes have adapted.');}const pad=controllerMove();let dx=joy.x+pad.x+(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=joy.y+pad.y+(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);let mag=Math.hypot(dx,dy);if(mag>.05){dx/=Math.max(1,mag);dy/=Math.max(1,mag);state.x=clamp(state.x+dx*dt*.19,50,WORLD-50);state.y=clamp(state.y+dy*dt*.19,50,WORLD-50);state.steps+=dt*.19}for(const c of companions){c.t-=dt;if(c.t<=0||!c.target||dist(c,c.target)<18){c.t=rand(1800,4800);let follow=c.kind==='rabbit'||Math.random()<.35;let ox=follow?state.x:c.x,oy=follow?state.y:c.y;c.target={x:clamp(ox+rand(-180,180),60,WORLD-60),y:clamp(oy+rand(-180,180),60,WORLD-60)};c.mode=follow?'following':'exploring'}if(c.kind==='rabbit'&&dist(c,state)>260)c.target={x:state.x+35,y:state.y+30};let d=dist(c,c.target);if(d>3){c.x+=(c.target.x-c.x)/d*dt*(c.kind==='fox'?.075:.09);c.y+=(c.target.y-c.y)/d*dt*(c.kind==='fox'?.075:.09)}}cam.x+=(state.x-cam.x)*Math.min(1,dt*.006);cam.y+=(state.y-cam.y)*Math.min(1,dt*.006);if(near(ruins,130)&&!state.discoveries.includes('runestone')){state.discoveries.push('runestone');memory('Haigen discovered an ancient runestone in the eastern woods!')}if(near(pond,180)&&!state.discoveries.includes('pond')){state.discoveries.push('pond');memory('Haigen found the shimmering woodland pond.')}if(state.wood>=3&&state.stone>=2&&!state.quests.collect){state.quests.collect=true;memory('First supplies gathered! Haigen can now build a campfire.')}if(state.friends.skolli>=40&&!state.quests.friend){state.quests.friend=true;memory('Sköllii is beginning to trust Haigen.')}}function closest(){let candidates=objects.filter(o=>!state.removed.includes(o.id)&&o.type!=='flower'&&near(o,90)).map(o=>({o,d:dist(o,state),type:'resource'}));for(let c of companions)if(near(c,110))candidates.push({o:c,d:dist(c,state),type:'friend'});if(near(cottage,125))candidates.push({o:cottage,d:dist(cottage,state),type:'home'});if(near(ruins,100))candidates.push({o:ruins,d:dist(ruins,state),type:'ruins'});return candidates.sort((a,b)=>a.d-b.d)[0]}function interact(){let c=closest();if(!c){notify('Walk close to a tree, rock, berry bush or friend.');return}if(c.type==='resource'){let o=c.o;state.removed.push(o.id);if(o.type==='tree'){state.wood+=2;notify('🪵 Collected 2 wood!')}if(o.type==='rock'){state.stone+=2;notify('🪨 Collected 2 stone!')}if(o.type==='bush'){state.berries+=3;notify('🍓 Collected 3 berries!')}}else if(c.type==='friend'){let f=c.o;if(state.berries>0){state.berries--;state.friends[f.kind==='fox'?'skolli':'heri']=Math.min(100,state.friends[f.kind==='fox'?'skolli':'heri']+8);notify(`🍓 ${f.name} enjoyed a berry! Friendship grew.`)}else{notify(`${f.name} is ${f.mode}. Bring berries to make friends!`)}}else if(c.type==='home'){notify('🏡 Your woodland cottage. A new adventure begins here!')}else{notify('ᚠ An ancient rune. What secrets does this forest hold?')}save()}function call(){for(let c of companions){c.target={x:state.x+rand(-60,60),y:state.y+rand(-60,60)};c.t=5000}notify('📣 You called Dillon and Sköllii! Sköllii may take his time...')}function open(html){$('modalBody').innerHTML=html;$('overlay').classList.add('open')}function close(){$('overlay').classList.remove('open');save()}function journal(){open(`<h2>📖 The Discovery Journal</h2><p>Every woodland adventure becomes part of your story.</p><p><b>🐇 Dillon friendship:</b> ${state.friends.heri}/100<br><b>🦊 Sköllii friendship:</b> ${state.friends.skolli}/100</p><h3>Current region: ${biomeAt(state.x,state.y)}</h3><p>Explore seven connected regions.</p><h3>Memories</h3>${state.memories.map(m=>`<p style="border-bottom:1px solid #ffffff33;padding-bottom:9px">${m}</p>`).join('')}`)}const recipes=[{kind:'campfire',name:'🔥 Campfire',wood:3,stone:2,desc:'A cosy place to gather'},{kind:'garden',name:'🌱 Berry garden',wood:4,stone:1,desc:'A little patch of woodland'},{kind:'shelter',name:'🏡 Small shelter',wood:8,stone:5,desc:'Build a second woodland home'}];function craft(){open(`<h2>🔨 Build Your World</h2><p>Collect wood from trees, stone from rocks and berries from bushes. Structures appear near Haigen.</p>${recipes.map((r,i)=>`<div class="item"><div><b>${r.name}</b><div class="small">${r.desc}<br>🪵 ${r.wood} &nbsp; 🪨 ${r.stone}</div></div><button class="btn" data-recipe="${i}">Build</button></div>`).join('')}<p class="small">Your world saves automatically on this device.</p>`);document.querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>build(+b.dataset.recipe))}function build(i){let r=recipes[i];if(state.wood<r.wood||state.stone<r.stone){notify('Not enough materials yet!');return}state.wood-=r.wood;state.stone-=r.stone;state.structures.push({kind:r.kind,x:clamp(state.x+rand(70,125),100,WORLD-100),y:clamp(state.y+rand(55,105),100,WORLD-100)});if(!state.quests.home){state.quests.home=true;memory('Haigen built his first woodland structure!')}close();notify(`${r.name} built!`);save()}function help(){open(`<h2>🌲 Welcome to Haigen's World</h2><p><b>Your adventure:</b> Explore the woodland, collect materials, build structures, discover secrets and befriend Dillon and Sköllii.</p><p>🎮 <b>Move:</b> Drag the on-screen joystick, use an Xbox controller's left stick or D-pad, or use WASD / arrow keys.<br>✨ <b>Interact:</b> Stand near a tree, rock, bush, friend or landmark and tap Interact.<br>🍓 <b>Friends:</b> Collect berries and give them to your companions.<br>🔨 <b>Build:</b> Craft a campfire, garden or shelter.<br>📖 <b>Journal:</b> Remember your adventures.</p><p><b>First quest:</b> Gather 3 wood and 2 stone, then build a campfire!</p><p class="small">Version 0.2 • Offline-friendly after loading • Progress stored in this browser, not synced between devices.</p><button class="btn" id="resetBtn">Reset saved world</button>`);$('resetBtn').onclick=()=>{if(confirm('Start a new world? This deletes your local progress.')){localStorage.removeItem('wandererSave');location.reload()}}}function joyMove(e){const rect=$('joy').getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;let x=(e.clientX-cx)/43,y=(e.clientY-cy)/43,m=Math.hypot(x,y);joy={x:x/Math.max(1,m),y:y/Math.max(1,m)};$('stick').style.transform=`translate(${joy.x*32}px,${joy.y*32}px)`}const j=$('joy');j.addEventListener('pointerdown',e=>{j.setPointerCapture(e.pointerId);joyMove(e)});j.addEventListener('pointermove',e=>{if(j.hasPointerCapture(e.pointerId))joyMove(e)});function release(){joy={x:0,y:0};$('stick').style.transform='translate(0,0)'}j.addEventListener('pointerup',release);j.addEventListener('pointercancel',release);addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '&&!e.repeat)interact();if(e.key==='Escape')close()});addEventListener('keyup',e=>keys[e.key]=false);$('interactBtn').onclick=interact;$('callBtn').onclick=call;$('journalBtn').onclick=journal;$('craftBtn').onclick=craft;$('helpBtn').onclick=help;$('closeBtn').onclick=close;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});function frame(now){let dt=Math.min(now-last,50);last=now;if(!$('overlay').classList.contains('open'))update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);setTimeout(()=>notify('🌲 Welcome, Haigen! Collect wood and stone to build your first campfire.'),700)})();
