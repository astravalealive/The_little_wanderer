;const down=i=>pad.buttons[i]&&pad.buttons[i].pressed?1:0;let x=axis(0),y=axis(1);if(pad.mapping==='standard'){x+=down(15)-down(14);y+=down(13)-down(12)}return {x,y}}function update(dt){time+=dt;state.daytime+=dt*.018;const pad=controllerMove();const pads=navigator.getGamepads?Array.from(navigator.getGamepads()||[]):[];const connected=pads.filter(p=>p&&p.connected);const debug=$('padDebug');if(debug){const active=connected[0];debug.textContent=active?'🎮 Connected · stick '+pad.x.toFixed(2)+', '+pad.y.toFixed(2)+' · AI '+(state.autonomy?'ON':'OFF'):'🎮 No controller detected · AI '+(state.autonomy?'ON':'OFF')}const playerInput=Math.hypot(pad.x,pad.y)>0.22||Math.hypot(joy.x,joy.y)>0.12||!!(keys.d||keys.a||keys.w||keys.s||keys.ArrowRight||keys.ArrowLeft||keys.ArrowUp||keys.ArrowDown);if(state.autonomy&&playerInput)setAutonomy(false);if(state.autonomy){autonomousTick(dt)}let dx=joy.x+pad.x+(keys.d||keys.ArrowRight?1:0)-(keys.a||keys.ArrowLeft?1:0),dy=joy.y+pad.y+(keys.s||keys.ArrowDown?1:0)-(keys.w||keys.ArrowUp?1:0);let mag=Math.hypot(dx,dy);if(!state.autonomy&&mag>.05){dx/=Math.max(1,mag);dy/=Math.max(1,mag);state.x=clamp(state.x+dx*dt*.19,50,WORLD-50);state.y=clamp(state.y+dy*dt*.19,50,WORLD-50);state.steps+=dt*.19}for(const c of companions){c.t-=dt;if(c.t<=0||!c.target||dist(c,c.target)<18){c.t=rand(1800,4800);let follow=c.kind==='rabbit'||Math.random()<.35;let ox=follow?state.x:c.x,oy=follow?state.y:c.y;c.target={x:clamp(ox+rand(-180,180),60,WORLD-60),y:clamp(oy+rand(-180,180),60,WORLD-60)};c.mode=follow?'following':'exploring'}if(c.kind==='rabbit'&&dist(c,state)>260)c.target={x:state.x+35,y:state.y+30};let d=dist(c,c.target);if(d>3){c.x+=(c.target.x-c.x)/d*dt*(c.kind==='fox'?.075:.09);c.y+=(c.target.y-c.y)/d*dt*(c.kind==='fox'?.075:.09)}}cam.x+=(state.x-cam.x)*Math.min(1,dt*.006);cam.y+=(state.y-cam.y)*Math.min(1,dt*.006);for(let f of state.structures){if(f.kind==='campfire'&&f.lit===true&&Number.isFinite(f.fuel)){f.fuel-=dt/1000;if(f.fuel<=0){f.lit=false;f.fuel=0;notify('🔥 A campfire has burned out.')}}}if(near(ruins,130)&&!state.discoveries.includes('runestone')){state.discoveries.push('runestone');memory('Haigen discovered an ancient runestone in the eastern woods!')}if(near(pond,180)&&!state.discoveries.includes('pond')){state.discoveries.push('pond');memory('Haigen found the shimmering woodland pond.')}if(state.wood>=3&&state.stone>=2&&!state.quests.collect){state.quests.collect=true;memory('First supplies gathered! Haigen can now build a campfire.')}if(state.friends.skolli>=40&&!state.quests.friend){state.quests.friend=true;memory('Skölli is beginning to trust Haigen.')}}function closest(){let candidates=objects.filter(o=>!state.removed.includes(o.id)&&o.type!=='flower'&&near(o,90)).map(o=>({o,d:dist(o,state),type:'resource'}));for(let c of companions)if(near(c,110))candidates.push({o:c,d:dist(c,state),type:'friend'});for(let f of state.structures)if(f.kind==='campfire'&&near(f,100))candidates.push({o:f,d:dist(f,state),type:'fire'});if(near(cottage,125))candidates.push({o:cottage,d:dist(cottage,state),type:'home'});if(near(ruins,100))candidates.push({o:ruins,d:dist(ruins,state),type:'ruins'});return candidates.sort((a,b)=>a.d-b.d)[0]}function interact(){let c=closest();if(!c){notify('Walk close to a tree, rock, berry bush or friend.');return}if(c.type==='resource'){let o=c.o;state.removed.push(o.id);if(o.type==='tree'){let amount=state.tools.axe?4:2;state.wood+=amount;notify('🪵 Collected '+amount+' wood!')}if(o.type==='rock'){state.stone+=2;notify('🪨 Collected 2 stone!')}if(o.type==='bush'){state.berries+=3;notify('🍓 Collected 3 berries!')}}else if(c.type==='friend'){let f=c.o;if(state.berries>0){state.berries--;state.friends[f.kind==='fox'?'skolli':'heri']=Math.min(100,state.friends[f.kind==='fox'?'skolli':'heri']+8);notify(`🍓 ${f.name} enjoyed a berry! Friendship grew.`)}else{notify(`${f.name} is ${f.mode}. Bring berries to make friends!`)}}else if(c.type==='fire'){let fire=c.o;if(fire.lit===false){if(state.wood<1){notify('Need 1 wood to light this fire.');return}state.wood--;fire.lit=true;fire.fuel=180;notify('🔥 Campfire lit!')}else if(state.berries>=2){state.berries-=2;state.food++;notify('🍲 Cooked a berry meal!')}else if(state.wood>=1){state.wood--;fire.fuel=(fire.fuel||180)+120;notify('🪵 Added fuel to the fire!')}else notify('Bring berries to cook or wood for fuel.')}else if(c.type==='home'){notify('🏡 Your woodland cottage. A new adventure begins here!')}else{notify('ᚠ An ancient rune. What secrets does this forest hold?')}save()}function call(){for(let c of companions){c.target={x:state.x+rand(-60,60),y:state.y+rand(-60,60)};c.t=5000}notify('📣 You called Dillon and Skölli! Skölli may take his time...')}function open(html){$('modalBody').innerHTML=html;$('overlay').classList.add('open')}function close(){$('overlay').classList.remove('open');save()}function journal(){open(`<h2>📖 The Discovery Journal</h2><p>Every woodland adventure becomes part of your story.</p><p><b>🐇 Dillon friendship:</b> ${state.friends.heri}/100<br><b>🦊 Skölli friendship:</b> ${state.friends.skolli}/100</p><h3>Haigen's thoughts and plans</h3><p>${autoThought()}</p><p><b>Mode:</b> ${state.autonomy?'Haigen is adventuring independently':'You are in control'}</p><h3>Memories</h3>${state.memories.map(m=>`<p style="border-bottom:1px solid #ffffff33;padding-bottom:9px">${m}</p>`).join('')}`)}const recipes=[{kind:'axe',name:'🪓 Stone axe',wood:2,stone:2,desc:'Collect twice as much wood'},{kind:'torch',name:'🔦 Torch',wood:2,stone:1,desc:'A useful tool for future dark adventures'},{kind:'meal',name:'🍲 Berry meal',wood:0,stone:0,berries:3,desc:'Prepare food from gathered berries'},{kind:'campfire',name:'🔥 Campfire',wood:3,stone:2,desc:'A cosy place to gather'},{kind:'garden',name:'🌱 Berry garden',wood:4,stone:1,desc:'A little patch of woodland'},{kind:'shelter',name:'🏡 Small shelter',wood:8,stone:5,desc:'Build a second woodland home'}];function craft(){open(`<h2>🔨 Build Your World</h2><p>Collect wood from trees, stone from rocks and berries from bushes. Craft tools and food or build structures near Haigen. New campfires start unlit: interact nearby and spend wood to light them.</p>${recipes.map((r,i)=>`<div class="item"><div><b>${r.name}</b><div class="small">${r.desc}<br>🪵 ${r.wood} &nbsp; 🪨 ${r.stone}${r.berries?' &nbsp; 🍓 '+r.berries:''}</div></div><button class="btn" data-recipe="${i}">Build</button></div>`).join('')}<p class="small">Your world saves automatically on this device.</p>`);document.querySelectorAll('[data-recipe]').forEach(b=>b.onclick=()=>build(+b.dataset.recipe))}function build(i){let r=recipes[i];if(state.wood<r.wood||state.stone<r.stone||state.berries<(r.berries||0)){notify('Not enough materials yet!');return}state.wood-=r.wood;state.stone-=r.stone;state.berries-=r.berries||0;if(r.kind==='axe'||r.kind==='torch'){state.tools[r.kind]++;close();notify(r.name+' crafted!');save();return}if(r.kind==='meal'){state.food++;close();notify('🍲 Meal prepared!');save();return}state.structures.push({kind:r.kind,x:clamp(state.x+rand(70,125),100,WORLD-100),y:clamp(state.y+rand(55,105),100,WORLD-100),...(r.kind==='campfire'?{lit:false,fuel:0}:{})});if(!state.quests.home){state.quests.home=true;memory('Haigen built his first woodland structure!')}close();notify(`${r.name} built!`);save()}function help(){open(`<h2>🌲 Welcome to Haigen's World</h2><p><b>Your adventure:</b> Explore the woodland, collect materials, build structures, discover secrets and befriend Dillon and Skölli.</p><p>🎮 <b>Move:</b> Drag the on-screen joystick, use an Xbox controller's left stick or D-pad, or use WASD / arrow keys.<br>✨ <b>Interact:</b> Stand near a tree, rock, bush, friend or landmark and tap Interact.<br>🍓 <b>Friends:</b> Collect berries and give them to your companions.<br>🔨 <b>Build:</b> Craft a campfire, garden or shelter.<br>📖 <b>Journal:</b> Remember your adventures.</p><p><b>First quest:</b> Gather 3 wood and 2 stone, then build a campfire!</p><p class="small">Version 0.4 • Offline-friendly after loading • Progress stored in this browser, not synced between devices.</p><button class="btn" id="resetBtn">Reset saved world</button>`);$('resetBtn').onclick=()=>{if(confirm('Start a new world? This deletes your local progress.')){localStorage.removeItem('wandererTestSave');location.reload()}}}function joyMove(e){const rect=$('joy').getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;let x=(e.clientX-cx)/43,y=(e.clientY-cy)/43,m=Math.hypot(x,y);joy={x:x/Math.max(1,m),y:y/Math.max(1,m)};$('stick').style.transform=`translate(${joy.x*32}px,${joy.y*32}px)`}const j=$('joy');j.addEventListener('pointerdown',e=>{j.setPointerCapture(e.pointerId);joyMove(e)});j.addEventListener('pointermove',e=>{if(j.hasPointerCapture(e.pointerId))joyMove(e)});function release(){joy={x:0,y:0};$('stick').style.transform='translate(0,0)'}j.addEventListener('pointerup',release);j.addEventListener('pointercancel',release);addEventListener('keydown',e=>{keys[e.key]=true;if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();if(e.key===' '&&!e.repeat)interact();if(e.key==='Escape')close()});addEventListener('keyup',e=>keys[e.key]=false);$('interactBtn').onclick=interact;$('callBtn').onclick=call;$('journalBtn').onclick=journal;$('modeBtn').onclick=()=>setAutonomy(!state.autonomy);$('autoTouchBtn').addEventListener('pointerup',e=>{e.preventDefault();setAutonomy(!state.autonomy)});$('craftBtn').onclick=craft;$('helpBtn').onclick=help;$('closeBtn').onclick=close;$('overlay').addEventListener('click',e=>{if(e.target===$('overlay'))close()});function frame(now){let dt=Math.min(now-last,50);last=now;if(!$('overlay').classList.contains('open'))update(dt);draw();requestAnimationFrame(frame)}offlineProgress();$('modeBtn').textContent=state.autonomy?'🎮 Take control':'🤖 Let Haigen play';$('autoTouchBtn').textContent=$('modeBtn').textContent;requestAnimationFrame(frame);if(state.returnReport.length)setTimeout(showReturnReport,350);setTimeout(()=>notify('🌲 Welcome, Haigen! Collect wood and stone to build your first campfire.'),700)})();
</script></body></html>
